name: Deploy

on:
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.NOMBRE_BASE }}
  IMAGE_RAMA: ${{ replace(github.ref_name, '/', '-') }}
jobs:
  deploy_job:
    name: Construir y subir Docker
    runs-on: ubuntu-latest
    environment: desa
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Pull Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci.yml
          name: next-build
          path: .next
          repo: ${{ github.repository }}

      - name: Obtener el SHA corto de commit
        id: short-sha
        uses: benjlevesque/short-sha@v3.0

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        run: |   
          
          IMAGE_TAG: ${{ env.IMAGE_RAMA }}-${{ steps.short-sha.outputs.sha }}
          echo "Construyendo la imagen: $IMAGE_NAME:$IMAGE_TAG"
          docker build . -t $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:$IMAGE_TAG